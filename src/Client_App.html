<script>
(function(){
  var state = {
    token: sessionStorage.getItem('wrc_token') || '',
    user: null,
    route: 'dashboard',
    cache: {},
    loading: false
  };

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtMoney(n){ n = Number(n||0); if(isNaN(n)) n=0; return n.toLocaleString('fa-IR') + ' تومان'; }
  function fmtNum(n){ n=Number(n||0); if(isNaN(n)) n=0; return n.toLocaleString('fa-IR'); }
  function badge(text, type){ return '<span class="badge '+(type||'')+'">'+esc(text)+'</span>'; }
  function todayIso(){ var d=new Date(); var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),da=('0'+d.getDate()).slice(-2); return y+'-'+m+'-'+da; }
  // Jalali (Shamsi) date label for UI display; falls back to ISO when Intl is unavailable.
  function todayLabel(){
    try { return new Date().toLocaleDateString('fa-IR', { year:'numeric', month:'long', day:'numeric' }); }
    catch(e){ return todayIso(); }
  }
  function initial(u){ var s = (u && (u.display_name || u.username)) || '?'; return String(s).trim().charAt(0); }

  /* ---- dashboard period helpers (daily / weekly / monthly + custom range) ---- */
  function isoAddDays(iso, days){
    var d = new Date(String(iso) + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + Number(days || 0));
    return d.toISOString().substring(0, 10);
  }
  function monthStart(iso){ return String(iso).substring(0, 8) + '01'; }
  function dashRange(){
    if (!state.range) {
      var to = todayIso();
      state.range = { from: monthStart(to), to: to, granularity: 'day', preset: 'month' };
    }
    return state.range;
  }
  function applyDashPreset(id){
    var to = todayIso(), from = to;
    if (id === '7d') from = isoAddDays(to, -6);
    else if (id === '30d') from = isoAddDays(to, -29);
    else if (id === 'month') from = monthStart(to);
    var cur = dashRange();
    state.range = { from: from, to: to, granularity: cur.granularity || 'day', preset: id };
    loadRoute('dashboard');
  }
  function faDate(iso){
    try { return new Date(String(iso) + 'T00:00:00').toLocaleDateString('fa-IR', { year:'numeric', month:'2-digit', day:'2-digit' }); }
    catch(e){ return String(iso || ''); }
  }
  function compactMoney(n){
    n = Number(n || 0);
    var neg = n < 0; n = Math.abs(n);
    function f(x){ return Number(Math.round(x * 10) / 10).toLocaleString('fa-IR'); }
    var s;
    if (n >= 1e9) s = f(n / 1e9) + ' میلیارد';
    else if (n >= 1e6) s = f(n / 1e6) + ' میلیون';
    else if (n >= 1e3) s = f(n / 1e3) + ' هزار';
    else s = fmtNum(n);
    return (neg ? '−' : '') + s;
  }
  function bucketLabelFa(key, gran){
    try {
      if (gran === 'month') {
        return new Date(String(key) + '-01T00:00:00').toLocaleDateString('fa-IR', { year:'numeric', month:'2-digit' });
      }
      return new Date(String(key) + 'T00:00:00').toLocaleDateString('fa-IR', { month:'2-digit', day:'2-digit' });
    } catch(e){ return String(key || ''); }
  }
  /* Lightweight inline SVG chart (no external libraries - works inside Apps Script). */
  function chartSvg(d){
    var buckets = (d && d.buckets) || [];
    var gran = (d && d.granularity) || 'day';
    if (!buckets.length) return '<div class="chart-empty">داده‌ای برای این بازه وجود ندارد.</div>';
    var hasData = false;
    buckets.forEach(function(b){ if (Number(b.income || 0) || Number(b.expense || 0)) hasData = true; });
    if (!hasData) return '<div class="chart-empty">در این بازه تراکنشی ثبت نشده است.</div>';

    var W = 920, H = 320, pl = 72, pr = 18, pt = 16, pb = 46;
    var iw = W - pl - pr, ih = H - pt - pb, base = pt + ih;
    var max = 0;
    buckets.forEach(function(b){ max = Math.max(max, Number(b.income || 0), Number(b.expense || 0)); });
    if (max <= 0) max = 1;
    var mag = Math.pow(10, Math.floor(Math.log(max) / Math.LN10));
    var step = mag / 2;
    max = Math.ceil(max / step) * step;

    var n = buckets.length, slot = iw / n;
    var bw = Math.max(2.5, Math.min(26, slot * 0.33));
    function yv(v){ return pt + ih - (ih * (Math.max(0, Number(v || 0)) / max)); }

    var parts = [];
    for (var gi = 0; gi <= 4; gi++) {
      var val = max * gi / 4, yy = yv(val);
      parts.push('<line class="chart-grid" x1="' + pl + '" y1="' + yy.toFixed(1) + '" x2="' + (W - pr) + '" y2="' + yy.toFixed(1) + '"/>');
      parts.push('<text class="chart-axis" x="' + (pl - 10) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end">' + esc(compactMoney(val)) + '</text>');
    }

    var bars = [], netPts = [];
    var every = Math.max(1, Math.ceil(n / 14));
    buckets.forEach(function(b, i){
      var cx = pl + slot * i + slot / 2;
      var inc = Number(b.income || 0), exp = Number(b.expense || 0);
      var yi = yv(inc), hi = base - yi;
      var ye = yv(exp), he = base - ye;
      var xi = cx - bw - 1.5, xe = cx + 1.5;
      var lbl = bucketLabelFa(b.key, gran);
      var tip = lbl + ' — درآمد: ' + fmtMoney(inc) + ' | هزینه: ' + fmtMoney(exp) + ' | خالص: ' + fmtMoney(b.net);
      bars.push('<g><title>' + esc(tip) + '</title>');
      if (hi >= 0.5) bars.push('<rect class="chart-bar income" x="' + xi.toFixed(1) + '" y="' + yi.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hi.toFixed(1) + '" rx="2.5"/>');
      if (he >= 0.5) bars.push('<rect class="chart-bar expense" x="' + xe.toFixed(1) + '" y="' + ye.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + he.toFixed(1) + '" rx="2.5"/>');
      bars.push('</g>');
      netPts.push(cx.toFixed(1) + ',' + yv(b.net).toFixed(1));
      if (i % every === 0) {
        bars.push('<text class="chart-axis x" x="' + cx.toFixed(1) + '" y="' + (base + 24) + '" text-anchor="middle">' + esc(lbl) + '</text>');
      }
    });

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="نمودار درآمد و هزینه">' +
      '<defs>' +
        '<linearGradient id="chartGold" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#F0D97A"/>' +
          '<stop offset="100%" stop-color="#C9A227"/>' +
        '</linearGradient>' +
      '</defs>' +
      parts.join('') +
      '<line class="chart-base" x1="' + pl + '" y1="' + base + '" x2="' + (W - pr) + '" y2="' + base + '"/>' +
      bars.join('') +
      (netPts.length > 1 ? '<polyline class="chart-net" points="' + netPts.join(' ') + '"/>' : '') +
      '</svg>';
  }

  function logoHtml(){
    return (typeof WRC_LOGO_HTML === 'string') ? WRC_LOGO_HTML : '';
  }
  function logoMarkHtml(){
    return (typeof WRC_LOGO_MARK_HTML === 'string') ? WRC_LOGO_MARK_HTML : logoHtml();
  }

  function api(action, payload){
    return new Promise(function(resolve, reject){
      google.script.run
        .withSuccessHandler(function(res){
          if(res && res.ok) resolve(res.data);
          else reject(res && res.error ? res.error : {message:'خطای نامشخص'});
        })
        .withFailureHandler(function(err){
          reject({code:'CLIENT', message: (err && err.message) ? err.message : 'خطا در ارتباط با سرور'});
        })
        .apiCall(action, payload || {}, state.token || '');
    });
  }

  function setToken(t){ state.token = t||''; if(t) sessionStorage.setItem('wrc_token', t); else sessionStorage.removeItem('wrc_token'); }

  function toast(msg, type){
    var el = $('#toast');
    if(!el){
      el = document.createElement('div');
      el.id = 'toast';
      el.setAttribute('role','status');
      el.setAttribute('aria-live','polite');
      document.body.appendChild(el);
    }
    var item = document.createElement('div');
    item.className = 'alert ' + (type||'info');
    item.textContent = msg;
    el.appendChild(item);
    setTimeout(function(){
      try{ item.classList.add('hide'); }catch(e){}
      setTimeout(function(){ try{ el.removeChild(item); }catch(e){} }, 220);
    }, 3400);
  }

  var routes = [
    {id:'dashboard', title:'داشبورد', roles:['admin','operator','doctor']},
    {id:'customers', title:'مشتریان', roles:['admin','operator','doctor']},
    {id:'operations', title:'عملیات', roles:['admin','operator'], children:[
      {id:'doctors', title:'تعریف پزشک', roles:['admin','operator']},
      {id:'operators', title:'تعریف اپراتور', roles:['admin','operator']},
      {id:'services', title:'تعریف خدمات', roles:['admin','operator']},
      {id:'commissionRules', title:'تعریف پورسانت', roles:['admin']}
    ]},
    {id:'invoices', title:'ثبت فاکتور', roles:['admin','operator','doctor']},
    {id:'expenses', title:'هزینه‌ها', roles:['admin','operator']},
    {id:'revenue', title:'درآمدهای متفرقه', roles:['admin']},
    {id:'commissions', title:'پورسانت‌ها', roles:['admin','doctor']},
    {id:'reports', title:'گزارش‌ها', roles:['admin','operator']},
    {id:'users', title:'کاربران', roles:['admin']},
    {id:'settings', title:'تنظیمات', roles:['admin']}
  ];

  function routeMeta(routeId){
    for (var i = 0; i < routes.length; i++) {
      var r = routes[i];
      if (r.children && r.children.length) {
        for (var j = 0; j < r.children.length; j++) {
          if (r.children[j].id === routeId) return r.children[j];
        }
      } else if (r.id === routeId) {
        return r;
      }
    }
    return null;
  }
  function allowed(routeId){
    var r = routeMeta(routeId);
    if(!r || !state.user) return false;
    return r.roles.indexOf(state.user.role) >= 0;
  }
  function render(){
    var app = $('#app');
    if(!state.token || !state.user){ renderLogin(app); return; }
    renderShell(app);
  }

  function renderLogin(app){
    app.innerHTML =
      '<div class="login-wrap"><div class="login-card">'+
      '<div class="login-brand"><div class="logo lockup">'+logoHtml()+'</div><p>سامانه مدیریت کلینیک رز سفید</p></div>'+
      '<div id="loginAlert"></div>'+
      '<div class="form-group"><label>نام کاربری</label><input id="loginUser" autocomplete="username"></div>'+
      '<div class="form-group"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password"></div>'+
      '<div class="row"><button class="btn gold block" id="loginBtn">ورود به سامانه</button></div>'+
      '<details class="setup-details"><summary>راه‌اندازی اولیه (فقط در صورت نبود مدیر فعال)</summary>'+
      '<div class="form-group"><label>نام کاربری مدیر</label><input id="bootUser" autocomplete="off"></div>'+
      '<div class="form-group"><label>رمز عبور مدیر</label><input id="bootPass" type="password" autocomplete="new-password"></div>'+
      '<div class="form-group"><label>نام نمایشی</label><input id="bootName" value="مدیر سیستم"></div>'+
      '<button class="btn secondary sm block" id="bootBtn">ایجاد مدیر اولیه</button>'+
      '</details>'+
      '<div class="login-hint"><span>ورود با نام کاربری و رمز عبور</span><span>نسخه ۰.۲</span></div>'+
      '</div></div>';
    $('#loginBtn').onclick = doLogin;
    $('#bootBtn').onclick = doBootstrap;
    $('#loginPass').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ doLogin(); } });
    $('#loginUser').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ $('#loginPass').focus(); } });
  }

  function renderShell(app){
    var navHtml = routes.map(function(r){
      if (r.children && r.children.length) {
        var kids = r.children.filter(function(c){ return allowed(c.id); });
        if (!kids.length) return '';
        var open = kids.some(function(c){ return c.id === state.route; });
        return '<div class="nav-group'+(open ? ' open' : '')+'">'+
          '<button type="button" class="nav-group-head">'+
            '<span>'+esc(r.title)+'</span><span class="chev" aria-hidden="true">▾</span>'+
          '</button>'+
          '<div class="nav-sub">'+
            kids.map(function(c){ return '<button type="button" data-route="'+c.id+'" class="'+(state.route===c.id?'active':'')+'">'+esc(c.title)+'</button>'; }).join('')+
          '</div>'+
        '</div>';
      }
      if (!allowed(r.id)) return '';
      return '<button data-route="'+r.id+'" class="'+(state.route===r.id?'active':'')+'">'+esc(r.title)+'</button>';
    }).join('');
    app.innerHTML =
      '<div class="app-shell">'+
        '<aside class="sidebar">'+
          '<div class="brand"><div class="logo">'+logoMarkHtml()+'</div><div><div class="title">ROSE SEFID</div><div class="subtitle">BEAUTY CLINIC</div></div></div>'+
          '<nav class="nav">'+navHtml+'</nav>'+
          '<div class="sidebar-footer">'+
            '<div class="user-chip"><span class="avatar">'+esc(initial(state.user))+'</span>'+
              '<span class="user-meta"><span class="user-name">'+esc(state.user.display_name||state.user.username)+'</span>'+
              '<span class="user-role">'+esc(roleLabel(state.user.role))+'</span></span></div>'+
            '<button class="btn secondary sm block" id="logoutBtn">خروج</button>'+
          '</div>'+
        '</aside>'+
        '<main class="main">'+
          '<div class="topbar"><div class="page-title" id="pageTitle"></div>'+
            '<div class="user"><span class="badge info">'+esc(roleLabel(state.user.role))+'</span>'+
            '<span class="avatar">'+esc(initial(state.user))+'</span>'+
            '<span>'+esc(state.user.username)+'</span></div></div>'+
          '<div class="content" id="content"><div class="panel">در حال بارگذاری...</div></div>'+
        '</main>'+
      '</div>';
    $all('.nav-group-head').forEach(function(b){
      b.onclick = function(){ b.parentNode.classList.toggle('open'); };
    });
    $all('.nav button[data-route]').forEach(function(b){ b.onclick = function(){ navigate(b.getAttribute('data-route')); }; });
    $('#logoutBtn').onclick = doLogout;
    navigate(state.route || 'dashboard');
  }

  function roleLabel(r){ return r==='admin'?'مدیر':(r==='operator'?'اپراتور':(r==='doctor'?'پزشک':r)); }
  function navigate(routeId){
    if(!allowed(routeId)) routeId='dashboard';
    state.route = routeId;
    $all('.nav button[data-route]').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-route')===routeId); });
    $all('.nav-group').forEach(function(g){
      var inside = $all('button[data-route]', g).some(function(b){ return b.getAttribute('data-route')===routeId; });
      if (inside) g.classList.add('open');
    });
    var r = routeMeta(routeId);
    if($('#pageTitle')) $('#pageTitle').textContent = r ? r.title : '';
    loadRoute(routeId);
  }

  function doLogin(){
    var u=$('#loginUser').value.trim(), p=$('#loginPass').value;
    var alert=$('#loginAlert'); alert.innerHTML='';
    if(!u||!p){ alert.innerHTML='<div class="alert error">نام کاربری و رمز عبور الزامی است.</div>'; return; }
    $('#loginBtn').disabled=true;
    api('auth.login',{username:u,password:p,deviceInfo:navigator.userAgent||''}).then(function(data){
      setToken(data.token); state.user = data.user;
      if(data.mustChangePassword){ renderChangePassword(true); } else { render(); }
    }).catch(function(err){ alert.innerHTML='<div class="alert error">'+esc(err.message||'خطا در ورود')+'</div>'; }).finally(function(){ var b=$('#loginBtn'); if(b) b.disabled=false; });
  }

  function doBootstrap(){
    var u=$('#bootUser').value.trim(), p=$('#bootPass').value, n=$('#bootName').value.trim();
    var alert=$('#loginAlert');
    if(!u||!p){ alert.innerHTML='<div class="alert error">اطلاعات مدیر اولیه ناقص است.</div>'; return; }
    $('#bootBtn').disabled=true;
    api('setup.bootstrapAdmin',{username:u,password:p,displayName:n||'مدیر سیستم'}).then(function(){
      alert.innerHTML='<div class="alert success">مدیر اولیه ایجاد شد. اکنون وارد شوید.</div>';
    }).catch(function(err){ alert.innerHTML='<div class="alert error">'+esc(err.message||'خطا')+'</div>'; }).finally(function(){ var b=$('#bootBtn'); if(b) b.disabled=false; });
  }

  function renderChangePassword(forced){
    var app=$('#app');
    app.innerHTML='<div class="login-wrap"><div class="login-card"><div class="login-brand"><h1>تغییر رمز عبور</h1><p>'+ (forced?'تغییر رمز در اولین ورود الزامی است.':'') +'</p></div><div id="cpAlert"></div><div class="form-group"><label>رمز فعلی</label><input id="oldP" type="password"></div><div class="form-group"><label>رمز جدید</label><input id="newP" type="password"></div><button class="btn gold" id="cpBtn">ذخیره و ادامه</button></div></div>';
    $('#cpBtn').onclick=function(){
      api('auth.changePassword',{token:state.token,oldPassword:$('#oldP').value,newPassword:$('#newP').value}).then(function(){
        $('#cpAlert').innerHTML='<div class="alert success">رمز عبور تغییر کرد. دوباره وارد شوید.</div>';
        setToken(''); state.user=null; setTimeout(render, 800);
      }).catch(function(err){ $('#cpAlert').innerHTML='<div class="alert error">'+esc(err.message||'خطا')+'</div>'; });
    };
  }

  function doLogout(){
    api('auth.logout',{token:state.token}).finally(function(){ setToken(''); state.user=null; render(); });
  }
  function loadRoute(routeId){
    var c = $('#content'); if(!c) return;
    c.innerHTML = '<div class="panel loading"><span class="spinner" aria-hidden="true"></span> در حال بارگذاری…</div>';
    var fn = {
      dashboard: viewDashboard, customers: viewCustomers, doctors: viewDoctors, operators: viewOperators,
      services: viewServices, invoices: viewInvoices, expenses: viewExpenses, revenue: viewRevenue,
      commissions: viewCommissions, commissionRules: viewCommissionRules, reports: viewReports,
      users: viewUsers, settings: viewSettings
    }[routeId];
    if(!fn){ c.innerHTML='<div class="panel">صفحه یافت نشد.</div>'; return; }
    Promise.resolve().then(fn).catch(function(err){ c.innerHTML='<div class="panel"><div class="alert error">'+esc(err.message||'خطا در بارگذاری')+'</div></div>'; if(err && err.code==='UNAUTHORIZED'){ setToken(''); state.user=null; render(); } });
  }

  function card(t,v,h){ return '<div class="card"><h3>'+esc(t)+'</h3><div class="value">'+esc(v)+'</div>'+ (h?'<div class="hint">'+esc(h)+'</div>':'') +'</div>'; }

  function viewDashboard(){
    var r0 = dashRange();
    return Promise.all([
      api('reports.period', { from: r0.from, to: r0.to, granularity: r0.granularity }),
      api('reports.dashboard', {}).catch(function(){ return {}; })
    ]).then(function(res){
      var d = res[0] || {};
      var k = res[1] || {};
      var t = d.totals || {};
      var cards = '';
      if (state.user.role === 'doctor') {
        cards += card('فاکتورهای بازه', fmtNum(t.invoices_count));
        cards += card('مبلغ فاکتورهای بازه', fmtMoney(t.invoices_total));
        cards += card('پورسانت قابل پرداخت', fmtMoney(k.commission_payable));
        cards += card('پورسانت پرداخت‌شده', fmtMoney(k.commission_paid));
      } else {
        cards += card('درآمد بازه', fmtMoney(t.income), 'فاکتور ' + fmtMoney(t.income_payments) + ' + متفرقه ' + fmtMoney(t.income_misc));
        cards += card('هزینه بازه', fmtMoney(t.expense));
        cards += card('خالص بازه', fmtMoney(t.net), Number(t.net) < 0 ? 'زیان در این بازه' : 'سود در این بازه');
        cards += card('فاکتورهای بازه', fmtNum(t.invoices_count), fmtMoney(t.invoices_total));
        cards += card('پورسانت قابل پرداخت', fmtMoney(k.commission_payable_total !== undefined ? k.commission_payable_total : t.commission_payable));
        cards += card('مشتریان', fmtNum(k.customers_count));
      }
      var preset = r0.preset || '';
      function seg(id, label){ return '<button class="seg-btn' + (preset === id ? ' active' : '') + '" data-preset="' + id + '">' + label + '</button>'; }
      var quick = '';
      [['customers','مشتریان'],['invoices','ثبت فاکتور'],['services','تعریف خدمات'],['commissions','پورسانت‌ها'],['reports','گزارش‌ها']].forEach(function(x){
        if (allowed(x[0])) quick += '<button class="btn secondary sm" data-go="'+x[0]+'">'+esc(x[1])+'</button>';
      });
      /* __DASH_PART2__ */
      $('#content').innerHTML =
        '<div class="panel">'+
          '<div class="panel-header"><h2>گزارش بازه</h2>'+
            '<div class="range-bar">'+
              '<div class="segmented">'+seg('today','امروز')+seg('7d','۷ روز')+seg('30d','۳۰ روز')+seg('month','این ماه')+'</div>'+
              '<select id="dashGran" class="input-sm" aria-label="دقت گزارش">'+
                '<option value="day"'+((d.granularity||'day')==='day'?' selected':'')+'>روزانه</option>'+
                '<option value="week"'+(d.granularity==='week'?' selected':'')+'>هفتگی</option>'+
                '<option value="month"'+(d.granularity==='month'?' selected':'')+'>ماهانه</option>'+
              '</select>'+
              '<input type="date" id="dashFrom" class="input-sm" value="'+esc(d.from||r0.from)+'" aria-label="از تاریخ">'+
              '<span class="muted small">تا</span>'+
              '<input type="date" id="dashTo" class="input-sm" value="'+esc(d.to||r0.to)+'" aria-label="تا تاریخ">'+
              '<button class="btn gold sm" id="dashApply">اعمال</button>'+
            '</div>'+
          '</div>'+
          '<div class="grid cards">'+cards+'</div>'+
          '<div class="chart-card">'+
            '<div class="chart-head">'+
              '<div class="chart-title">درآمد، هزینه و خالص</div>'+
              '<div class="chart-legend">'+

      $('#addUser').onclick=function(){ showModal('<h3>کاربر جدید</h3><div class="form-grid"><div class="form-group"><label>نام کاربری</label><input id="u1"></div><div class="form-group"><label>رمز عبور</label><input id="u2" type="password"></div><div class="form-group"><label>نام نمایشی</label><input id="u3"></div><div class="form-group"><label>نقش</label><select id="u4"><option value="admin">مدیر</option><option value="operator">اپراتور</option><option value="doctor">پزشک</option></select></div><div class="form-group"><label>شناسه پزشک (برای نقش پزشک)</label><select id="u5"><option value="">-</option>'+doctors.map(function(d){return '<option value="'+esc(d.id)+'">'+esc(d.full_name)+'</option>';}).join('')+'</select></div><div class="form-group"><label>شناسه اپراتور (اختیاری)</label><select id="u6"><option value="">-</option>'+operators.map(function(o){return '<option value="'+esc(o.id)+'">'+esc(o.full_name)+'</option>';}).join('')+'</select></div></div><div class="row"><button class="btn gold" id="sv">ذخیره</button><button class="btn secondary" id="cn">انصراف</button></div>', function(close){ $('#cn').onclick=close; $('#sv').onclick=function(){ api('users.create',{username:$('#u1').value,password:$('#u2').value,display_name:$('#u3').value,role:$('#u4').value,linked_doctor_id:$('#u5').value,linked_operator_id:$('#u6').value}).then(function(){toast('کاربر ایجاد شد','success'); close(); loadRoute('users');}).catch(function(e){toast(e.message||'خطا','error');}); };}); };
    });
  }

  function viewSettings(){
    return api('settings.get',{}).then(function(map){
      $('#content').innerHTML = '<div class="panel"><div class="panel-header"><h2>تنظیمات</h2></div><div class="alert info">اجرای Setup ساختار شیت‌ها (بدون داده نمونه). شناسه Spreadsheet و AUTH_PEPPER باید در Script Properties تنظیم شوند (خارج از مخزن). برای کالیبراسیون PBKDF2 تابع سروری <code>wrcCalibratePbkdf2()</code> توسط مالک اجرا شود.</div><div class="row" style="margin-bottom:12px"><button class="btn gold" id="runSetup">اجرای Setup شیت‌ها</button></div><div class="form-grid"><div class="form-group"><label>مالیات فعال (true/false)</label><input id="s1" value="'+esc(map.tax_enabled||'true')+'"></div><div class="form-group"><label>نرخ پیش‌فرض مالیات (%)</label><input id="s2" value="'+esc(map.tax_default_rate||'0')+'"></div><div class="form-group"><label>پیشوند شماره فاکتور</label><input id="s3" value="'+esc(map.invoice_prefix||'WRC')+'"></div></div><div class="row" style="margin-top:10px"><button class="btn" id="saveSet">ذخیره تنظیمات</button></div></div>';
      $('#runSetup').onclick=function(){ api('setup.run',{}).then(function(){ toast('راه‌اندازی انجام شد','success'); }).catch(function(e){ toast(e.message||'خطا','error'); }); };
      $('#saveSet').onclick=function(){ Promise.all([api('settings.set',{key:'tax_enabled',value:$('#s1').value}), api('settings.set',{key:'tax_default_rate',value:$('#s2').value}), api('settings.set',{key:'invoice_prefix',value:$('#s3').value})]).then(function(){ toast('تنظیمات ذخیره شد','success'); }).catch(function(e){ toast(e.message||'خطا','error'); }); };
    });
  }
  function viewInvoices(){
    return Promise.all([api('invoices.list',{}), state.user.role==='doctor'?Promise.resolve([]):api('customers.list',{}), state.user.role==='doctor'?Promise.resolve([]):api('doctors.list',{}), state.user.role==='doctor'?Promise.resolve([]):api('services.list',{})]).then(function(res){
      var rows=res[0]||[], customers=res[1]||[], doctors=res[2]||[], services=res[3]||[];
      var canCreate = state.user.role==='admin' || state.user.role==='operator';
      var cName = {};
      customers.forEach(function(c){ cName[String(c.id)] = c.full_name || ''; });
      function money(n){ var v = Number(n||0); return v ? fmtMoney(v) : '<span class="muted">—</span>'; }
      $('#content').innerHTML = '<div class="panel"><div class="panel-header"><h2>ثبت فاکتور</h2><div class="toolbar">'+(canCreate?'<button class="btn gold sm" id="newInv">فاکتور جدید</button>':'')+'</div></div><div class="table-wrap"><table><thead><tr><th>شماره</th><th>تاریخ</th><th>مشتری</th><th>جمع</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+ rows.map(function(r){ return '<tr><td>'+esc(r.invoice_no||'-')+'</td><td>'+esc(r.invoice_date)+'</td><td>'+esc(cName[String(r.customer_id)]||'—')+'</td><td>'+fmtMoney(r.total_toman)+'</td><td>'+money(r.paid_toman)+'</td><td>'+money(r.balance_toman)+'</td><td>'+statusBadge(r.status)+'</td><td><button class="btn sm secondary" data-view="'+esc(r.id)+'">مشاهده</button></td></tr>'; }).join('') +'</tbody></table></div></div>';
      if(canCreate) $('#newInv').onclick=function(){ openInvoiceModal(null, customers, doctors, services); };
      $all('[data-view]').forEach(function(b){ b.onclick=function(){ openInvoiceDetail(b.getAttribute('data-view'), customers, doctors, services); }; });
    });
  }

  function openInvoiceModal(row, customers, doctors, services){
    row=row||{}; var items = (row.items&&row.items.length)?row.items:[{service_id:'',quantity:1,unit_price_toman:0,description:''}];
    function renderItems(){ return '<div id="invItems">'+items.map(function(it,i){ return '<div class="form-grid" style="margin-bottom:8px;border:1px solid #2a3333;padding:8px;border-radius:8px"><div class="form-group"><label>خدمت</label><select data-i="'+i+'" data-k="service_id"><option value="">-</option>'+services.map(function(s){return '<option value="'+esc(s.id)+'" '+(s.id===it.service_id?'selected':'')+'>'+esc(s.name)+'</option>';}).join('')+'</select></div><div class="form-group"><label>quantity</label><input type="number" step="1" min="1" data-i="'+i+'" data-k="quantity" value="'+esc(it.quantity||1)+'"></div><div class="form-group"><label>مبلغ واحد (تومان)</label><input type="number" data-i="'+i+'" data-k="unit_price_toman" value="'+esc(it.unit_price_toman||0)+'"></div><div class="form-group"><label>شرح</label><input data-i="'+i+'" data-k="description" value="'+esc(it.description||'')+'"></div></div>'; }).join('')+'</div>'; }
    showModal('<h3>فاکتور</h3><div class="form-grid"><div class="form-group"><label>تاریخ</label><input id="iv_date" value="'+esc(row.invoice_date||todayIso())+'"></div><div class="form-group"><label>مشتری</label><select id="iv_cust"><option value="">-</option>'+customers.map(function(c){return '<option value="'+esc(c.id)+'" '+(c.id===row.customer_id?'selected':'')+'>'+esc(c.full_name)+'</option>';}).join('')+'</select></div><div class="form-group"><label>پزشک</label><select id="iv_doc"><option value="">-</option>'+doctors.map(function(d){return '<option value="'+esc(d.id)+'" '+(d.id===row.doctor_id?'selected':'')+'>'+esc(d.full_name)+'</option>';}).join('')+'</select></div></div><div class="form-group"><label>درخواست تخفیف کل (تومان) - نیازمند تأیید مدیر</label><input id="iv_disc" type="number" value="'+esc(row.discount_requested_toman||0)+'"></div><div class="form-group"><label>توضیح تخفیف</label><input id="iv_disc_note" value="'+esc(row.discount_request_note||'')+'"></div><h4>آیتم‌ها</h4>'+renderItems()+'<button class="btn sm secondary" id="addItem">افزودن آیتم</button><div class="row" style="margin-top:12px"><button class="btn gold" id="saveInv">ذخیره پیش‌نویس</button><button class="btn secondary" id="cnInv">انصراف</button></div>', function(close){
      function bind(){ $all('#invItems [data-i]').forEach(function(el){ el.onchange=function(){ var i=Number(el.getAttribute('data-i')), k=el.getAttribute('data-k'); items[i]=items[i]||{}; items[i][k]= (k==='quantity'||k==='unit_price_toman')?Number(el.value):el.value; if(k==='service_id'){ var svc=services.filter(function(s){return s.id===el.value;})[0]; if(svc && !items[i].unit_price_toman) items[i].unit_price_toman=Number(svc.base_price_toman||0); var container=document.getElementById('invItems'); if(container){ container.outerHTML=renderItems(); bind(); } } }; }); }
      bind();
      $('#addItem').onclick=function(){ items.push({service_id:'',quantity:1,unit_price_toman:0,description:''}); var container=document.getElementById('invItems'); if(container){ container.outerHTML=renderItems(); bind(); } };
      $('#cnInv').onclick=close;
      $('#saveInv').onclick=function(){ $all('#invItems [data-i]').forEach(function(el){ var i=Number(el.getAttribute('data-i')), k=el.getAttribute('data-k'); items[i][k]=(k==='quantity'||k==='unit_price_toman')?Number(el.value):el.value; }); var payload={id:row.id,invoice_date:$('#iv_date').value,customer_id:$('#iv_cust').value,doctor_id:$('#iv_doc').value,discount_requested_toman:Number($('#iv_disc').value||0),discount_request_note:$('#iv_disc_note').value,items:items.filter(function(it){return it.service_id || it.unit_price_toman || it.description;})}; api('invoices.saveDraft',payload).then(function(){toast('ذخیره شد','success'); close(); loadRoute('invoices');}).catch(function(e){toast(e.message||'خطا','error');}); };
    });
  }

  function openInvoiceDetail(id, customers, doctors, services){
    api('invoices.get',{id:id}).then(function(data){
      var inv=data.invoice, items=data.items||[], pays=data.payments||[];
      var isAdmin = state.user.role==='admin';
      var canOp = state.user.role==='admin' || state.user.role==='operator';
      var actions = '';
      if(canOp && ['draft','pending_discount_approval'].indexOf(inv.status)>=0) actions += '<button class="btn sm" id="actIssue">صدور فاکتور</button> ';
      if(isAdmin && String(inv.discount_status)==='requested') actions += '<button class="btn sm gold" id="actApproveDisc">تأیید تخفیف</button> <button class="btn sm danger" id="actRejectDisc">رد تخفیف</button> ';
      if(canOp && ['issued','partially_paid'].indexOf(inv.status)>=0) actions += '<button class="btn sm" id="actPay">ثبت پرداخت</button> ';
      if(isAdmin && inv.status!=='void') actions += '<button class="btn sm danger" id="actVoid">ابطال فاکتور</button> ';
      var html = '<h3>فاکتور '+esc(inv.invoice_no||inv.id)+'</h3><div class="row small muted"><div>وضعیت: '+statusBadge(inv.status)+'</div><div>تخفیف: '+statusBadge(inv.discount_status||'none')+'</div></div><hr class="sep">'+
        '<div class="form-grid"><div><label>تاریخ</label><div>'+esc(inv.invoice_date)+'</div></div><div><label>جمع جزء</label><div>'+fmtMoney(inv.subtotal_toman)+'</div></div><div><label>تخفیف</label><div>'+fmtMoney(inv.discount_toman)+'</div></div><div><label>مالیات</label><div>'+fmtMoney(inv.tax_toman)+'</div></div><div><label>مبلغ کل</label><div><b>'+fmtMoney(inv.total_toman)+'</b></div></div><div><label>پرداخت‌شده/مانده</label><div>'+fmtMoney(inv.paid_toman)+' / '+fmtMoney(inv.balance_toman)+'</div></div></div>'+
        '<h4>آیتم‌ها</h4><div class="table-wrap"><table><thead><tr><th>خدمت</th><th>تعداد</th><th>مبلغ واحد</th><th>ناخالص</th><th>سهم تخفیف</th><th>مالیات</th><th>مبلغ خط</th></tr></thead><tbody>'+items.map(function(it){return '<tr><td>'+esc(it.service_name_snapshot||it.description||it.service_id)+'</td><td>'+esc(it.quantity)+'</td><td>'+fmtMoney(it.unit_price_toman)+'</td><td>'+fmtMoney(it.line_gross_toman)+'</td><td>'+fmtMoney(it.line_discount_alloc_toman)+'</td><td>'+fmtMoney(it.line_tax_toman)+'</td><td>'+fmtMoney(it.line_total_toman)+'</td></tr>';}).join('')+'</tbody></table></div>'+
        '<h4>پرداخت‌ها</h4><div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>مبلغ</th><th>روش</th><th>مرجع</th></tr></thead><tbody>'+pays.map(function(p){return '<tr><td>'+esc(p.payment_date)+'</td><td>'+fmtMoney(p.amount_toman)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.reference_no)+'</td></tr>';}).join('')+'</tbody></table></div>'+
        '<div class="row" style="margin-top:12px">'+actions+'<button class="btn secondary sm" id="actClose">بستن</button></div>';
      showModal(html, function(close){
        $('#actClose').onclick=close;
        if($('#actIssue')) $('#actIssue').onclick=function(){ api('invoices.issue',{id:inv.id}).then(function(){toast('فاکتور صادر شد و پورسانت محاسبه شد','success'); close(); loadRoute('invoices');}).catch(function(e){toast(e.message||'خطا','error');}); };
        if($('#actApproveDisc')) $('#actApproveDisc').onclick=function(){ var amt=prompt('مبلغ تخفیف تأییدشده (تومان):', inv.discount_requested_toman||0); if(amt===null) return; api('invoices.approveDiscount',{id:inv.id,approve:true,discount_approved_toman:Number(amt)}).then(function(){toast('تخفیف تأیید شد','success'); close(); loadRoute('invoices');}).catch(function(e){toast(e.message||'خطا','error');}); };
        if($('#actRejectDisc')) $('#actRejectDisc').onclick=function(){ var reason=prompt('دلیل رد:','')||''; api('invoices.approveDiscount',{id:inv.id,approve:false,reason:reason}).then(function(){toast('تخفیف رد شد','success'); close(); loadRoute('invoices');}).catch(function(e){toast(e.message||'خطا','error');}); };
        if($('#actPay')) $('#actPay').onclick=function(){ var amt=prompt('مبلغ پرداخت (تومان):', inv.balance_toman||0); if(amt===null) return; api('payments.add',{invoice_id:inv.id,amount_toman:Number(amt),payment_date:todayIso(),method:'cash'}).then(function(){toast('پرداخت ثبت شد','success'); close(); loadRoute('invoices');}).catch(function(e){toast(e.message||'خطا','error');}); };
        if($('#actVoid')) $('#actVoid').onclick=function(){ var reason=prompt('دلیل ابطال:',''); if(reason===null) return; api('invoices.void',{id:inv.id,reason:reason}).then(function(){toast('فاکتور باطل شد','success'); close(); loadRoute('invoices');}).catch(function(e){toast(e.message||'خطا','error');}); };
      });
    }).catch(function(e){ toast(e.message||'خطا','error'); });
  }

  function showModal(content, onBind){
    var root = document.createElement('div');
    root.className = 'modal-backdrop';
    root.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+content+'</div>';
    document.body.appendChild(root);
    document.body.classList.add('modal-open');

    function onKey(e){ if(e.key === 'Escape'){ close(); } }
    function close(){
      try{ document.body.removeChild(root); }catch(e){}
      document.body.classList.remove('modal-open');
      document.removeEventListener('keydown', onKey);
    }

    document.addEventListener('keydown', onKey);
    root.addEventListener('click', function(e){ if(e.target===root) close(); });
    try{
      var first = root.querySelector('input,select,textarea');
      if(first) first.focus();
    }catch(e){}
    onBind(close, root);
  }

  function boot(){
    if(state.token){
      api('auth.me',{}).then(function(d){ state.user = d.user; render(); }).catch(function(){ setToken(''); state.user=null; render(); });
    } else {
      api('system.ping',{}).then(function(){ render(); }).catch(function(){ render(); });
    }
  }

  boot();
})();
</script>
