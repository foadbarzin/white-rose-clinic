<style>
:root {
  --color-gold: #C9A227;
  --color-gold-light: #E2C45A;
  --color-gold-dark: #9E7C19;
  --color-black: #0B0B0B;
  --color-black-soft: #141414;
  --color-teal: #0B3D3A;
  --color-teal-dark: #072928;
  --color-teal-light: #14524E;
  --color-ivory: #F7F3E8;
  --color-white: #FFFFFF;
  --color-bg: #0F1111;
  --color-surface: #161A1A;
  --color-surface-2: #1E2424;
  --color-border: rgba(201,162,39,0.25);
  --color-text: #F7F3E8;
  --color-text-muted: #B8B2A3;
  --color-danger: #C0392B;
  --color-success: #1E8449;
  --color-warning: #D68910;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
  --font: Tahoma, Vazirmatn, "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; font-family: var(--font); background: var(--color-bg); color: var(--color-text); }
body { min-height: 100vh; }
a { color: var(--color-gold-light); }
button, input, select, textarea { font-family: inherit; }
.splash { min-height:100vh; display:flex; align-items:center; justify-content:center; background: radial-gradient(ellipse at top, #123533, #0B0B0B 60%); }
.splash-inner { text-align:center; padding:24px; }
.splash-logo svg { width:140px; height:140px; }
.splash h1 { color: var(--color-gold); font-size: 1.4rem; margin: 12px 0 4px; letter-spacing: 1px; }
.splash p { color: var(--color-text-muted); }

.app-shell { display:flex; min-height:100vh; }
.sidebar { width: 260px; background: linear-gradient(180deg, var(--color-teal-dark), #061414); border-left: 1px solid var(--color-border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.brand { padding:18px 16px; border-bottom:1px solid var(--color-border); display:flex; align-items:center; gap:12px; }
.brand .logo svg { width:46px; height:46px; }
.brand .title { font-size:0.95rem; color:var(--color-gold); font-weight:700; line-height:1.3; }
.brand .subtitle { font-size:0.7rem; color:var(--color-text-muted); }
.nav { padding:10px; overflow:auto; flex:1; }
.nav button { width:100%; text-align:right; background:transparent; border:1px solid transparent; color:var(--color-ivory); padding:10px 12px; border-radius:10px; cursor:pointer; margin-bottom:4px; font-size:0.95rem; }
.nav button:hover { background: rgba(201,162,39,0.08); border-color: rgba(201,162,39,0.2); }
.nav button.active { background: rgba(201,162,39,0.16); border-color: var(--color-gold-dark); color: var(--color-gold-light); }
.sidebar-footer { padding:12px; border-top:1px solid var(--color-border); font-size:0.8rem; color:var(--color-text-muted); }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; border-bottom:1px solid var(--color-border); background: rgba(11,11,11,0.7); backdrop-filter: blur(6px); position:sticky; top:0; z-index:5; }
.topbar .page-title { font-size:1.1rem; color:var(--color-gold-light); font-weight:700; }
.topbar .user { display:flex; align-items:center; gap:10px; color:var(--color-text-muted); font-size:0.9rem; }
.content { padding:18px; }
.grid { display:grid; gap:14px; }
.grid.cards { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.card { background: linear-gradient(180deg, var(--color-surface), var(--color-surface-2)); border:1px solid var(--color-border); border-radius: var(--radius); padding:16px; box-shadow: var(--shadow); }
.card h3 { margin:0 0 8px; font-size:0.9rem; color:var(--color-text-muted); font-weight:600; }
.card .value { font-size:1.4rem; color:var(--color-gold-light); font-weight:700; }
.card .hint { font-size:0.8rem; color:var(--color-text-muted); margin-top:4px; }
.panel { background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius); padding:16px; margin-bottom:14px; }
.panel-header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.panel-header h2 { margin:0; font-size:1rem; color:var(--color-gold-light); }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; }
.btn { background: var(--color-teal); color: var(--color-ivory); border:1px solid rgba(201,162,39,0.3); padding:9px 14px; border-radius:10px; cursor:pointer; font-weight:600; }
.btn:hover { background: var(--color-teal-light); }
.btn.gold { background: linear-gradient(180deg, var(--color-gold-light), var(--color-gold-dark)); color:#1a1406; border:none; }
.btn.danger { background:#6b1f1f; border-color:#8e2b2b; }
.btn.secondary { background:#222; }
.btn.sm { padding:6px 10px; font-size:0.85rem; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
input, select, textarea { width:100%; background:#101414; color:var(--color-text); border:1px solid #2b3333; border-radius:10px; padding:10px 12px; }
input:focus, select:focus, textarea:focus { outline:none; border-color: var(--color-gold); box-shadow: 0 0 0 2px rgba(201,162,39,0.15); }
label { display:block; margin-bottom:6px; color:var(--color-text-muted); font-size:0.9rem; }
.form-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px; }
.form-group { margin-bottom:10px; }
.table-wrap { overflow:auto; border:1px solid var(--color-border); border-radius:10px; }
table { width:100%; border-collapse: collapse; min-width: 600px; }
th, td { padding:10px 12px; border-bottom:1px solid #263030; text-align:right; font-size:0.92rem; }
th { background:#101716; color: var(--color-gold-light); position:sticky; top:0; }
tr:hover td { background: rgba(255,255,255,0.02); }
.badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:0.78rem; border:1px solid var(--color-border); }
.badge.success { color:#7DCEA0; border-color:#1E8449; background:rgba(30,132,73,0.15); }
.badge.warn { color:#F8C471; border-color:#B9770E; background:rgba(183,119,14,0.15); }
.badge.danger { color:#F1948A; border-color:#922B21; background:rgba(146,43,33,0.15); }
.badge.info { color:#85C1E9; border-color:#2471A3; background:rgba(36,113,163,0.15); }
.muted { color: var(--color-text-muted); }
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background: radial-gradient(ellipse at top, #123533, #0B0B0B 60%); }
.login-card { width:100%; max-width:420px; background: linear-gradient(180deg, #121616, #0E1010); border:1px solid var(--color-border); border-radius:16px; padding:24px; box-shadow: var(--shadow); }
.login-brand { text-align:center; margin-bottom:18px; }
.login-brand .logo svg { width:90px; height:90px; }
.login-brand h1 { margin:8px 0 0; color:var(--color-gold); font-size:1.2rem; }
.login-brand p { margin:4px 0 0; color:var(--color-text-muted); font-size:0.85rem; }
.alert { padding:10px 12px; border-radius:10px; margin-bottom:12px; border:1px solid var(--color-border); }
.alert.error { background: rgba(146,43,33,0.2); border-color:#922B21; color:#F5B7B1; }
.alert.success { background: rgba(30,132,73,0.2); border-color:#1E8449; color:#ABEBC6; }
.alert.info { background: rgba(36,113,163,0.2); border-color:#2471A3; color:#AED6F1; }
.hidden { display:none !important; }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
.modal { width:100%; max-width:720px; max-height:90vh; overflow:auto; background:var(--color-surface); border:1px solid var(--color-border); border-radius:14px; padding:16px; }
.modal h3 { margin:0 0 12px; color:var(--color-gold-light); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.spacer { flex:1; }
hr.sep { border:none; border-top:1px solid #2a3333; margin:14px 0; }
.small { font-size:0.85rem; }
@media (max-width: 900px) {
  .app-shell { flex-direction:column; }
  .sidebar { width:100%; height:auto; position:relative; }
  .nav { display:flex; overflow:auto; gap:6px; }
  .nav button { white-space:nowrap; width:auto; margin:0; }
  table { min-width: 520px; }
  .topbar { height:auto; padding:10px 14px; gap:8px; flex-wrap:wrap; }
}
</style>
